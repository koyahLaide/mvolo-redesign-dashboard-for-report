name: Sync & Deploy

on:
  schedule:
    - cron: '0 0,6,12,18 * * *' # every 6 hours
  workflow_dispatch: # manual trigger

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
      AWIN_API_KEY: ${{ secrets.AWIN_API_KEY }}
      AWIN_ADVERTISER_ID: ${{ secrets.AWIN_ADVERTISER_ID }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
      BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
      BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
      GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      GA4_CLIENT_EMAIL: ${{ secrets.GA4_CLIENT_EMAIL }}
      GA4_PRIVATE_KEY: ${{ secrets.GA4_PRIVATE_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLARITY_API_TOKEN: ${{ secrets.CLARITY_API_TOKEN }}
      KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      # ── 1. Checkout root repo ───────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          clean: true

      # ── 2. Cache database ───────────────────────────────────────────────────
      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/mvolo.db
          key: mvolo-db-${{ github.run_id }}
          restore-keys: mvolo-db-

      # ── 3. Create data directory ────────────────────────────────────────────
      - name: Create data directory
        run: mkdir -p data

      # ── 4. Setup Node ───────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 5. Install dependencies ─────────────────────────────────────────────
      - name: Install dependencies
        run: npm install

      # ── 5. Write .env from secrets ──────────────────────────────────────────
      - name: Create .env
        run: |
          cat > .env <<EOF
          SHOPIFY_STORE=${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN=${{ secrets.SHOPIFY_TOKEN }}
          AWIN_API_KEY=${{ secrets.AWIN_API_KEY }}
          AWIN_ADVERTISER_ID=${{ secrets.AWIN_ADVERTISER_ID }}
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID=${{ secrets.META_AD_ACCOUNT_ID }}
          BOL_CLIENT_ID=${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET=${{ secrets.BOL_CLIENT_SECRET }}
          GA4_PROPERTY_ID=${{ secrets.GA4_PROPERTY_ID }}
          GA4_CLIENT_EMAIL=${{ secrets.GA4_CLIENT_EMAIL }}
          GA4_PRIVATE_KEY=${{ secrets.GA4_PRIVATE_KEY }}
          SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          TRIPLEWHALE_API_KEY=${{ secrets.TRIPLEWHALE_API_KEY }}
          KLAVIYO_API_KEY=${{ secrets.KLAVIYO_API_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          EOF

      # ── 6. Run ETL sync ─────────────────────────────────────────────────────
      - name: Run sync
        run: node src/index.js sync

      # ── 7. Sync order items (SKU velocity) ─────────────────────────────────
      - name: Import historische Bol orders
        run: node src/scripts/import-bol-orders.js
        continue-on-error: true

      - name: Sync order items
        run: node src/scripts/backfill-order-items.js
        continue-on-error: true

      # ── 7b. Sync Klaviyo metrics ────────────────────────────────────────────
      - name: Sync Klaviyo metrics
        run: node src/scripts/sync-klaviyo-metrics.js
        continue-on-error: true

      # ── 7a8. Sync OPEX data ───────────────────────────────────────────────────
      - name: Sync OPEX
        run: node src/scripts/sync-opex.js
        continue-on-error: true

      # ── 7b0. Sync COGS valuta (USD/EUR) ──────────────────────────────────────
      - name: Sync COGS valuta
        run: node src/scripts/sync-cogs-currency.js
        continue-on-error: true

      # ── 7b1. Sync Bol Advertising spend ─────────────────────────────────────
      - name: Sync Bol Advertising
        run: node src/scripts/sync-bol-advertising.js
        continue-on-error: true
        env:
          BOL_ADVERTISING_CLIENT_ID: ${{ secrets.BOL_ADVERTISING_CLIENT_ID }}
          BOL_ADVERTISING_CLIENT_SECRET: ${{ secrets.BOL_ADVERTISING_CLIENT_SECRET }}

      # ── 7b2. Sync Tier 1 (bundle pairs + seizoensgewichten) ─────────────────
      - name: Sync Tier 1 data
        run: node src/scripts/sync-tier1.js
        continue-on-error: true

      # ── 7c. Email timing analyse (wekelijks) ────────────────────────────────
      - name: Email timing analyse
        run: node src/scripts/analyze-email-timing.js
        continue-on-error: true

      # ── 7d. Sync visitor sessions van Google Sheet ──────────────────────────
      # - name: Sync sessions
      #  run: node src/scripts/sync-sessions.js
      #  continue-on-error: true

      # ── 7e. Run ad spend sync ────────────────────────────────────────────────
      - name: Run spend sync
        run: node src/index.js sync-spend
        continue-on-error: true

      # ── 8. Copy DB into dashboard ───────────────────────────────────────────
      - name: Copy DB to dashboard
        run: |
          mkdir -p dashboard/data
          cp data/mvolo.db dashboard/data/mvolo.db
          grep -q 'function MaandMargeGrafiek' dashboard/app/page.tsx || sed -i 's/export default function DashboardPage/function MaandMargeGrafiek(){return null;}\nexport default function DashboardPage/' dashboard/app/page.tsx
          sed -i 's|<MaandMargeGrafiek />||g' dashboard/app/page.tsx || true
          sed -i '/Maandelijkse omzet.*brutomarge/d' dashboard/app/page.tsx || true

      # ── 9b. Force patch page.tsx op runner ─────────────────────────────────────
      # ── 9. Upload DB snapshot (manual runs only) ───────────────────────────
      #- name: Upload mvolo.db artifact
      #  if: github.event_name == 'workflow_dispatch'
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: mvolo-db-snapshot
      #    path: data/mvolo.db
      #    retention-days: 7

      # ── 10. Install dashboard deps ──────────────────────────────────────────
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      # ── 11. Deploy to Vercel ────────────────────────────────────────────────
      - name: Deploy to Vercel
        working-directory: dashboard
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx vercel build --prod --yes --token ${{ secrets.VERCEL_TOKEN }} && npx vercel deploy --prebuilt --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
